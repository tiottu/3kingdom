name: Android APK
# android/ 를 고치면 안드로이드 설치 파일(kkomajangsu.apk)을 만들어 Releases 에 올린다.
# 받는 주소: https://github.com/tiottu/3kingdom/releases/latest/download/kkomajangsu.apk
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk kkomajangsu.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: 꼬마 장수 안드로이드 앱 (${{ github.run_number }})
          body: |
            삼국지 꼬마 장수 안드로이드 설치 파일이에요. 크롬이 없어도 돼요.
            핸드폰에서 kkomajangsu.apk 를 눌러 받고, "출처를 알 수 없는 앱 설치"를 허용한 뒤 설치해요.
          files: kkomajangsu.apk
          make_latest: true
